name: post to instagram

# GitHub cron is UTC. Dubai is UTC+4, so the 09:00-22:00 Dubai window is
# 05:00-18:00 UTC. Runs every 15 minutes across it and a little either side;
# publish.js decides whether anything is actually due, and posts at most one.
# GitHub can delay scheduled runs by 5-20 minutes under load. That is fine here.
on:
  schedule:
    - cron: '*/15 4-19 * * *'
  workflow_dispatch:          # the Run workflow button, for a manual push

permissions:
  contents: write             # so the run can commit ig_scheduled.json back

concurrency:
  group: instagram-publish    # never two publishers at once
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: validate queue and media
        run: node publish.js --validate

      - name: publish whatever is due
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: node publish.js --due

      - name: save state
        if: success()
        run: |
          git config user.name  "pawlido-bot"
          git config user.email "bot@users.noreply.github.com"
          git add ig_scheduled.json ig_plan.json
          git diff --staged --quiet || git commit -m "posted [skip ci]"
          git pull --rebase
          git push
